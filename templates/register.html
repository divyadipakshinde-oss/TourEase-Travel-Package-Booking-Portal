{% extends "base.html" %}

{% block title %}Register | TourEase{% endblock %}

{% block content %}

<section class="register-section d-flex align-items-center">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8">

                <div class="register-card">

                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus register-icon"></i>
                        <h2 class="mt-3">Create Account</h2>
                        <p>Join TourEase and Start Your Journey</p>
                    </div>

                    <form method="POST">

                        <div class="mb-3">
                            <label>Full Name</label>
                            <input type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter Full Name"
                            required>
                        </div>

                        <div class="mb-3">
                            <label>Email Address</label>
                            <input type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter Email"
                            required>
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter Password"
                            required>
                        </div>

                        <div class="mb-3">
                            <label>Confirm Password</label>
                            <input type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm Password"
                            required>
                        </div>

                        <button type="submit"
                        class="btn btn-success register-btn w-100">
                            Register
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        Already have an account?
                        <a href="/login">Login Here</a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
