{% extends "base.html" %}

{% block title %}Manage Users | TourEase{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">Manage Users</h2>

    <div class="card shadow">
        <div class="card-body">

            <table class="table table-bordered table-hover text-center">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    {% for user in users %}
                    <tr>

                        <td>{{ user[0] }}</td>
                        <td>{{ user[1] }}</td>
                        <td>{{ user[2] }}</td>
                        <td>{{ user[3] }}</td>

                        <td>

                            <a href="/delete_user/{{ user[0] }}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Delete this user?')">

                               Delete

                            </a>

                        </td>

                    </tr>
                    {% endfor %}

                </tbody>

            </table>

        </div>
    </div>

</div>

{% endblock %}
